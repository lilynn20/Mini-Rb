[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.openssl", "composer"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
# Retry migrate up to 5x: Railway's private network (mysql.railway.internal)
# can take a few seconds to resolve at container start, so don't crash on the first miss.
cmd = "for i in 1 2 3 4 5; do php artisan migrate --force && break || (echo \"DB not ready, retrying in 3s...\"; sleep 3); done && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"